name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    name: Check and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Determine VSIX target
        id: target
        run: |
          node -e 'const fs = require("node:fs"); const os = require("node:os"); const target = `${os.platform()}-${os.arch()}`; if (!["darwin-arm64", "darwin-x64", "linux-x64", "win32-x64"].includes(target)) throw new Error(`Unsupported package target: ${target}`); fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${target}\n`);'
      - name: Package VSIX
        env:
          VSIX_TARGET: ${{ steps.target.outputs.target }}
        run: npm run package -- --target "$VSIX_TARGET" --out "terminal-sidebar-$VSIX_TARGET.vsix"
      - uses: actions/upload-artifact@v6
        with:
          name: terminal-sidebar-${{ steps.target.outputs.target }}
          path: terminal-sidebar-${{ steps.target.outputs.target }}.vsix
          if-no-files-found: error
