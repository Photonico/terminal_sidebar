name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    name: Check and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Determine VSIX target and output path
        id: target
        run: |
          node <<'NODE'
          const { appendFileSync: append_file_sync } = require('node:fs');
          const { name, version } = require('./package.json');
          const target_platform = `${process.platform}-${process.arch}`;
          const supported_targets = ['darwin-arm64', 'darwin-x64', 'linux-x64', 'win32-x64'];
          if (!supported_targets.includes(target_platform)) {
            throw new Error(`Unsupported package target: ${target_platform}`);
          }
          const package_path = `release/${name}-${target_platform}-${version}.vsix`;
          append_file_sync(process.env.GITHUB_OUTPUT, `target=${target_platform}\npackage_path=${package_path}\n`);
          NODE
      - name: Package VSIX
        env:
          VSIX_TARGET: ${{ steps.target.outputs.target }}
        run: npm run package -- --target "$VSIX_TARGET"
      - uses: actions/upload-artifact@v6
        with:
          name: terminal-sidebar-${{ steps.target.outputs.target }}
          path: ${{ steps.target.outputs.package_path }}
          if-no-files-found: error
